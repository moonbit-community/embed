name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  stable-build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Moon
        uses: moonbit-community/setup-moonbit@main
        with:
          version: stable

      - name: MoonBit version
        run: |
          moon version --all
          moonrun --version

      - name: Update dependencies
        run: moon update

      - name: Check package
        run: |
          moon check --target wasm --warn-list +73+79 --deny-warn
          moon check --target native --warn-list +73+79 --deny-warn

      - name: Test package
        run: |
          moon test --target wasm -j 1
          moon test --target native -j 1
          moon test --release --target wasm -j 1
          moon test --release --target native -j 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test generated bundles
        run: python tests/test_cli.py

      - name: Build WASM package
        run: moon build --target wasm --release

      - name: Check generated interfaces
        run: |
          moon info --target wasm
          git diff --exit-code

      - name: Check formatting
        run: moon fmt --check

  typo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_COLOR: 1
      TYPOS_VERSION: v1.19.0
    steps:
      - name: Download typos
        run: curl -LsSf https://github.com/crate-ci/typos/releases/download/$TYPOS_VERSION/typos-$TYPOS_VERSION-x86_64-unknown-linux-musl.tar.gz | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check typos
        run: typos
